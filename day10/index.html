<html>
<head>
<title>Day-10</title>
<style>
  body {
    font-family: Arial;
    margin: 0;
    background-color: #f4f4f4;
  }

  header {
    background-color: darkblue;
    color: white;
    padding: 15px;
    text-align: center;
  }

  nav {
    background-color: white;
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #ccc;
  }

  nav a {
    margin: 0 10px;
    text-decoration: none;
    color: darkblue;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
  }

  .note-card {
    background-color: white;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: transform 0.2s;
  }

  .note-card:hover {
    transform: scale(1.05);
    cursor: pointer;
  }

  .btn {
    background-color: darkblue;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    transition: background-color 0.2s;
  }

  .btn:hover {
    background-color: royalblue;
    cursor: pointer;
  }

  footer {
    background-color: darkblue;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>My Notes App</h1>
</header>

<nav>
  <a href="#">Home</a> |
  <a href="#">All Notes</a> |
  <a href="#">Login</a>
</nav>

<div class="grid-container">
  <div class="note-card"><h3>Math</h3><p>Triple integration, vector calculus</p></div>
  <div class="note-card"><h3>Chemistry</h3><p>Thermodynamics, kinetics</p></div>
  <div class="note-card"><h3>Python</h3><p>List, tuple, dictionary</p></div>
</div>

<div style="text-align:center;">
  <button class="btn">+ Add New Note</button>
</div>

<footer>
  <p>Made by Ajinkya Mahajan</p>
</footer>

</body>
</html>
