<html>
    <head>
        <title>Day9</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
            }
            .grid-container {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                padding: 20px;
            }
            .note-card{
                background-color: lightyellow;
                border: 1px solid gray;
                border-radius: 8px;
                padding: 15px;
                transition: transform 0.2s, box-shadow 0.2s;
            }
            .note-card:hover{
                transform: scale(1.05);
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                cursor: pointer;
            }
            .btn{
                background-color: darkblue;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                transition: background-color 0.2s;
            }
            .btn:hover{
                background-color: royalblue;
                cursor: pointer;
            }
        </style>
        <body>
            <h1 style="text-align: center;">Notes</h1>

        <div class="grid-container">
            <div class="note-card"><h3>Maths</h3><p>Notes1</p></div>
            <div class="note-card"><h3>Chemistry</h3><p>Notes2</p></div>
            <div class="note-card"><h3>Physics</h3><p>Notes3</p></div>
        </div>
        <div style="text-align:center; margin-top: 20px;">
            <button class="btn">Add New Notes</button>
        </div>
        </body>
    </head>
</html>
